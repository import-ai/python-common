[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python-common"
version = "0.1.0"
description = "Shared Python utilities for OmniBox services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet>=5.2.0",
    "fastapi>=0.116.1",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.36.0",
    "opentelemetry-exporter-otlp>=1.36.0",
    "opentelemetry-instrumentation-fastapi>=0.57b0",
    "opentelemetry-sdk>=1.36.0",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "shortuuid>=1.0.13",
]

[tool.setuptools]
packages = ["common"]

[tool.setuptools.package-dir]
common = "."
